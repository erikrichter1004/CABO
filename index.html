<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122439"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CABO"><title>CABO Online</title>
<style>:root{font-family:system-ui,sans-serif;color:#edf4ff;background:#0b1829}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:980px;margin:auto}h1{font-size:2.4rem;text-align:center}h2{margin-top:0}.panel{background:#182c42;border:1px solid #39536d;border-radius:18px;padding:20px;margin:12px 0}button,input,select{font:inherit;border-radius:10px;padding:11px;border:1px solid #66839d}button{cursor:pointer;background:#80d7bc;color:#0b2530;font-weight:700;margin:4px}button:disabled{opacity:.35;cursor:not-allowed}input,select{background:#0b1d30;color:white;max-width:100%}label{display:block;margin:12px 0}label>input,label>select{display:block;width:100%;margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{flex:1}.muted{color:#b2c3d2}.hidden{display:none!important}.cards{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.card{width:66px;height:94px;border-radius:10px;background:linear-gradient(145deg,#356388,#17334e);border:2px solid #8db4d4;color:white;font-size:25px;font-weight:800;display:grid;place-items:center}.card.face{background:#e9eff4;color:#14253b}.card.chosen{outline:4px solid #ffcc5a}.card:disabled{opacity:.7}.seat{border:1px solid #45627e;border-radius:12px;padding:10px;margin:8px 0}.active{border-color:#8de8bb;box-shadow:0 0 12px #2d9c72}.pill{padding:4px 10px;border-radius:20px;background:#314c63}#notice{position:sticky;top:0;background:#314e63;border-radius:10px;padding:9px;display:none;z-index:3}#notice.show{display:block}#center{display:flex;gap:24px;justify-content:center;align-items:center}#center>div{text-align:center}details{margin:12px 0;padding:10px;border:1px solid #3e5974;border-radius:10px}summary{cursor:pointer;font-weight:bold}.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 18px}small{font-size:.85rem}.danger{background:#f7a4a4}.outline{background:#d1dfef}
/* Shared CABO tabletop. Phase A: fixed seats and tactile card surfaces. */
.table-stage{width:100%;margin:18px auto 22px;isolation:isolate}
.table-felt{position:relative;width:100%;min-height:490px;overflow:hidden;border:11px solid #443023;border-radius:46% / 22%;background:radial-gradient(ellipse at 50% 57%,#246e58 0%,#174e42 53%,#10372f 88%);box-shadow:inset 0 0 0 3px #7e6140,inset 0 0 50px #071e1ab3,0 18px 32px #060d1a85;perspective:900px}
.table-felt:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(28deg,#ffffff06 0px,#ffffff06 1px,transparent 1px,transparent 8px);opacity:.24}
.table-rival{position:absolute;left:var(--seat-x);top:var(--seat-y);transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;gap:4px;z-index:2;min-width:76px;max-width:29%;text-align:center;color:#f8fcff;filter:drop-shadow(0 2px 5px #001a15)}
.table-rival-name{max-width:100%;padding:5px 10px;background:#0b3029d9;border:1px solid #95b7a480;border-radius:16px;font-weight:800;font-size:clamp(.69rem,1.7vw,.94rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.table-rival--active .table-rival-name,.table-own--active .table-own-label{border-color:#a5ffce;box-shadow:0 0 16px #5ce9b09c}
.table-rival-meta{font-size:clamp(.52rem,1.2vw,.72rem);white-space:nowrap;color:#c9e3d7}
.table-rival-hand{display:flex;justify-content:center;gap:0;padding-left:8px}
.table-card{appearance:none;display:grid;place-items:center;flex:0 0 auto;position:relative;width:clamp(39px,6.1vw,68px);height:clamp(58px,9vw,99px);padding:0;margin:0;border:2px solid #b5d5d5;border-radius:7px;color:#112b34;font-size:clamp(1rem,2.9vw,1.8rem);font-weight:900;background:linear-gradient(145deg,#24485f,#142d42);box-shadow:0 6px 10px #0008,inset 0 0 0 3px #779fa06e;transition:transform .22s cubic-bezier(.2,.9,.3,1.25),box-shadow .2s;touch-action:manipulation}
.table-card:not(.table-card--face):after{content:"✧";display:grid;place-items:center;position:absolute;inset:6px;border:1px solid #9ac8c788;border-radius:4px;color:#99d2c8aa;font-size:1.45rem;letter-spacing:0}
.table-card--face{background:linear-gradient(140deg,#fffaf0,#e4e3d3);border-color:#c4ad7c;box-shadow:0 6px 13px #0019,inset 0 0 0 4px #fffef8}
.table-card--rival{width:clamp(17px,3.7vw,32px);height:clamp(26px,5.4vw,47px);font-size:.75rem;margin-left:-7px;border-width:1px;border-radius:4px;box-shadow:0 3px 5px #0008}
.table-card--rival:after{inset:3px;font-size:.7rem}
.table-card--own{cursor:pointer}
.table-card--own:hover{transform:translateY(-6px)}
.table-card--selected{transform:translateY(-15px) rotate(-2deg)!important;box-shadow:0 8px 14px #0009,0 0 0 3px #f4dc86}
.table-card--peek{transform:translateY(-19px) rotateY(5deg);z-index:4;box-shadow:0 14px 23px #000b,0 0 0 3px #f7d98b}
.table-card--pile{width:clamp(45px,6.5vw,70px);height:clamp(65px,9.4vw,102px)}
.table-card:disabled{opacity:.8}
.table-center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;align-items:start;justify-content:center;gap:clamp(9px,3vw,40px);z-index:2}
.table-center--inactive{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 16px;border-radius:16px;background:#08342794;color:#e8fff2;white-space:nowrap}
.table-center-label{font-weight:800}
.table-center-hint{font-size:.75rem}
.table-pile{display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;font-size:clamp(.65rem,1.6vw,.8rem);white-space:nowrap;text-shadow:0 1px 4px #001b15}
.table-pile button:not(.table-card){padding:6px 9px;margin:0;font-size:.8rem;border-radius:10px}
.table-own{position:absolute;bottom:5%;left:50%;width:90%;transform:translateX(-50%);display:flex;align-items:center;flex-direction:column;gap:9px;z-index:3}
.table-own-label{color:#fff;font-weight:800;font-size:.88rem;text-shadow:0 2px 5px #061d17;padding:5px 12px;border:1px solid #ffffff55;border-radius:20px;background:#082e26c9}
.table-own-hand{display:flex;justify-content:center;gap:clamp(5px,1.6vw,14px);max-width:100%;padding:15px 4px 4px}
.room-controls{display:flex;flex-wrap:wrap;gap:6px}
.room-controls .seat{font-size:.76rem;flex:1 1 180px;padding:7px;margin:3px 0}
.room-controls .seat button{font-size:.7rem;padding:5px 8px}
@media(max-width:620px){body{padding:10px}main{max-width:none}.panel{padding:12px;border-radius:15px}.table-stage{width:calc(100% + 12px);margin-left:-6px}.table-felt{min-height:420px;border-width:7px;border-radius:34% / 13%}.table-rival{max-width:34%}.table-rival-name{padding:3px 5px}.table-card--own{width:clamp(34px,10vw,52px);height:clamp(51px,15vw,78px)}.table-own{bottom:4%}.table-center{top:49%}.table-card--rival{width:clamp(14px,5.1vw,25px);height:clamp(23px,7.4vw,38px)}.table-rival-hand{padding-left:5px}.table-rival-meta{font-size:.58rem}}
@media(prefers-reduced-motion:reduce){.table-card{transition:none}}
</style></head><body><main><h1>🎴 CABO Online</h1><div id="notice" role="status"></div><div id="app"></div></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script src="app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(error=>console.warn("Service Worker:",error)));}</script></body></html>
