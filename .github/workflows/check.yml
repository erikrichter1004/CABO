name: CABO code checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js && node --check sw.js
      - name: Manifest validity
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); if(!m.icons?.length || !m.start_url) process.exit(1)"
      - name: Rule regression tests
        run: node tests/rules.test.cjs
      - name: Simulated multi-client integration
        run: node tests/multiplayer.test.cjs
